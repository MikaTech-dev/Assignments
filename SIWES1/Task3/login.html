<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-zinc-50 flex flex-col items-center justify-center p-4 text-zinc-950">

    <div class="w-full max-w-sm">
        <div class="w-full rounded-xl border border-zinc-200 bg-white shadow-sm p-6 sm:p-8">
            <div class="flex flex-col items-center pb-6 text-center">
                <img 
                    src="./Ctech logo.PNG" 
                    onerror="this.onerror=null; this.src='Logo_00000.png';" 
                    alt="Logo" 
                    class="h-24 w-24 object-contain mb-4"
                />
                <h1 class="text-xl font-semibold tracking-tight text-zinc-950">Sign In</h1>
                <p class="text-sm text-zinc-500 mt-1">Enter your credentials to continue</p>
            </div>

            <form action="dashboard-form.html" method="GET" class="space-y-4">
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium leading-none text-zinc-950">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="name@example.com" 
                        class="flex h-9 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950"
                    />
                </div>

                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium leading-none text-zinc-950">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••" 
                        class="flex h-9 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950"
                    />
                </div>

                <div class="pt-2">
                    <button 
                        type="submit" 
                        class="inline-flex w-full items-center justify-center rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-zinc-50 shadow transition-colors hover:bg-zinc-800 focus:outline-none focus:ring-1 focus:ring-zinc-950 h-9">
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
